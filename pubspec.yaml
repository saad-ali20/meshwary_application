name: meshwary_app
description: "مشواري — تطبيق تأجير السكوتر الكهربائي."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Dependency injection
  get_it: ^9.3.0

  # Navigation
  go_router: ^17.5.0

  # Networking
  dio: ^5.11.1

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Connectivity
  connectivity_plus: ^6.1.0

  # Localization & typography
  intl: ^0.20.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
